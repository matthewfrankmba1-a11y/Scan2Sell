<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Scan sneaker box barcodes and build a spreadsheet of style codes, sizes and eBay/StockX/GOAT comps." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Scan2Sell" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Scan2Sell</title>
    <link rel="preload" as="image" href="/splash.jpg" />
    <style>
      /* Splash: inline so it paints before the app's CSS and JS load. */
      #splash { position: fixed; inset: 0; z-index: 1000; background: #000; transition: opacity 0.6s ease; }
      #splash img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 60% center; }
      #splash.hide { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/splash.jpg" alt="" fetchpriority="high" /></div>
    <script>
      // Show the splash, then fade it 1 second after the image is on screen.
      // Tap to skip; never hold the app back more than 4 seconds on a slow connection.
      (function () {
        var splash = document.getElementById("splash");
        var img = splash.querySelector("img");
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          splash.classList.add("hide");
          setTimeout(function () { splash.remove(); }, 700);
        }
        function start() { setTimeout(hide, 1000); }
        if (img.complete && img.naturalWidth) start();
        else {
          img.addEventListener("load", start);
          img.addEventListener("error", hide);
        }
        setTimeout(hide, 4000);
        splash.addEventListener("click", hide);
      })();
    </script>
    <div id="app"></div>

    <div id="scanner" hidden>
      <video playsinline muted autoplay></video>
      <div class="reticle" aria-hidden="true"></div>
      <div class="flash" aria-hidden="true"></div>
      <div class="scan-top">
        <span class="pill" id="scan-count">0 scans</span>
        <span class="spacer"></span>
        <button class="pill" id="torch" data-action="torch" aria-label="Flashlight" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </button>
        <button class="pill strong" data-action="close-scanner">Done</button>
      </div>
      <div class="scan-panel">
        <div id="scan-last"></div>
        <form class="manual">
          <input name="upc" inputmode="numeric" pattern="[0-9]*" placeholder="Or type a UPC" autocomplete="off" aria-label="UPC" />
          <button class="primary" type="submit">Add</button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
